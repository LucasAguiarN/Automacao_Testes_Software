<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Avaliação disciplina Automação de Testes de Software</title>
    <style>
        body {
            background-color: #81d1ff;
            font-family: Arial, sans-serif;
        }
        form {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            border: 4px solid #02a2ff;
            border-radius: 8px;
            background-color: #ffffff;
            text-align: center;
        }
        input, select, textarea {
            width: 300px;
            border: 2px solid rgb(0, 0, 0);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .data input { 
            width: 80px; 
        }
        p{
            color: rgb(51, 0, 255); 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form onsubmit="event.preventDefault(); document.getElementById('msg').textContent = 'Feedback enviado com sucesso!';">
        <h2>Avaliação Disciplina<br>Automação de Testes de Software</h2>

        <label for="nome" >Nome</label><br>
        <input type="text" id="nome" name="nome" placeholder="Nome Completo" required><br>

        <label for="ra">RA</label><br>
        <input type="text" id="ra" name="ra" placeholder="RA do Aluno" required><br>

        <label>Data de Nascimento</label><br>
        <div class="data">
            <input type="number" id="dia" name="dia" min="1" max="31" placeholder="Dia" required> /
            <input type="number" id="mes" name="mes" min="1" max="12" placeholder="Mês" required> /
            <input type="number" id="ano" name="ano" min="1950" max="2026" placeholder="Ano" required>
        </div>

        <label for="curso">Curso</label><br>
        <select id="curso" name="curso" required>
            <option value="analise_desenvolvimento">Análise e Desenvolvimento de Sistemas</option>
            <option value="sistemas_informacao">Sistema de Informação</option>
        </select><br>

        <label for="aproveitamento">Aproveitamento do conteúdo</label><br>
        <select id="aproveitamento" name="aproveitamento" required>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select><br>

        <label for="sugestoes">Sugestões de melhoria para próximas turmas</label><br>
        <textarea id="sugestoes" name="sugestoes" required></textarea><br>

        <label for="observacoes">Observações</label><br>
        <textarea id="observacoes" name="observacoes"></textarea><br>

        <button type='submit' id="btn">Enviar Feedback</button>
        <p id="msg"></p>
    </form>
</body>
</html>
